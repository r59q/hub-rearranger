openapi: 3.1.0
info:
  title: Hub Rearranger Issues API
  version: 1.0.0
  description: Presents recently active GitHub issues and their relationships for selected repositories.
servers:
  - url: http://localhost:8081
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/issues:
    get:
      operationId: listRecentIssues
      parameters:
        - name: repository
          in: query
          description: Selected repository in owner/name form. Repeat for each repository.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              pattern: '^[^/]+/[^/]+$'
          style: form
          explode: true
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        '200':
          description: Open issues ordered by most recent GitHub activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/GitHubUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: Invalid query parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GitHubUnavailable:
      description: GitHub could not be reached or rejected the configured credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: The request could not be completed due to an internal failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Label:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        name:
          type: string
        color:
          type: string
          pattern: '^[0-9a-fA-F]{6}$|^$'
    RelatedIssue:
      type: object
      additionalProperties: false
      required: [number, repository, title, state, html_url]
      properties:
        number:
          type: integer
          minimum: 1
        repository:
          type: string
        title:
          type: string
        state:
          type: string
        html_url:
          type: string
          format: uri
    Issue:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - repository
        - title
        - description
        - state
        - html_url
        - updated_at
        - labels
        - subtasks
        - linked_issues
        - linked_pull_requests
        - details_available
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        number:
          type: integer
          minimum: 1
        repository:
          type: string
        title:
          type: string
        description:
          type: string
        state:
          type: string
        html_url:
          type: string
          format: uri
        updated_at:
          type: string
          format: date-time
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/RelatedIssue'
        linked_issues:
          type: array
          items:
            $ref: '#/components/schemas/RelatedIssue'
        linked_pull_requests:
          type: array
          items:
            $ref: '#/components/schemas/RelatedIssue'
        details_available:
          type: boolean
    IssuePage:
      type: object
      additionalProperties: false
      required:
        - issues
        - page
        - per_page
        - has_next
        - unavailable_repositories
        - incomplete_details
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        has_next:
          type: boolean
        unavailable_repositories:
          type: array
          items:
            type: string
        incomplete_details:
          type: integer
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

name: Application checks

on:
  push:
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'ops/**'
      - 'compose.yaml'
      - 'Makefile'
      - '.github/agent-profiles.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'ops/**'
      - 'compose.yaml'
      - 'Makefile'
      - '.github/agent-profiles.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  check:
    # All checks are offline and never use Codex authentication or a private runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache-dependency-path: |
            services/*/go.sum
            ops/agent-intake/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend tools
        working-directory: frontend
        run: npm ci
      - name: Install runtime and profile tools
        run: |
          python3 -m venv ops/private-runner/.venv
          ops/private-runner/.venv/bin/python -m pip install -r ops/agent-profiles/requirements-dev.txt
      - name: Check application, profiles, workflows, and generated contracts
        run: make check

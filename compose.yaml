name: hub-rearranger

services:
  repositories:
    build:
      context: ./services/repositories
    environment:
      # Create a fine-grained GitHub token with read-only Metadata and Issues access.
      # Store it as GITHUB_TOKEN in the root .env; never commit or share it.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in the environment or root .env file}
      REPOSITORIES_ADDR: :8080
      REPOSITORIES_DB_PATH: /app/data/repositories.db
    init: true
    ports:
      - '127.0.0.1:${REPOSITORIES_PORT:-8080}:8080'
    volumes:
      - repositories-data:/app/data
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--output-document=/dev/null', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  issues:
    build:
      context: ./services/issues
    environment:
      # Read-only Metadata and Issues permissions are sufficient for issue cards and relationships.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in the environment or root .env file}
      ISSUES_ADDR: :8081
    init: true
    ports:
      - '127.0.0.1:${ISSUES_PORT:-8081}:8081'
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--output-document=/dev/null', 'http://127.0.0.1:8081/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  agents:
    build:
      context: ./services/agents
    environment:
      # Read-only Metadata/Contents for profiles; Actions read access for readiness evidence.
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in the environment or root .env file}
      AGENTS_ADDR: :8082
    init: true
    ports:
      - '127.0.0.1:${AGENTS_PORT:-8082}:8082'
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--output-document=/dev/null', 'http://127.0.0.1:8082/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  identity:
    build:
      context: ./services/identity
    environment:
      IDENTITY_ADDR: :8083
      IDENTITY_DB_PATH: /app/data/identity.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      # Optional as a group: sign-in stays disabled until the App is configured.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      IDENTITY_ENCRYPTION_KEY: ${IDENTITY_ENCRYPTION_KEY:-}
    init: true
    ports:
      - '127.0.0.1:${IDENTITY_PORT:-8083}:8083'
    volumes:
      - identity-data:/app/data
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--output-document=/dev/null', 'http://127.0.0.1:8083/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    depends_on:
      repositories:
        condition: service_healthy
      issues:
        condition: service_healthy
    environment:
      ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      REPOSITORIES_API_URL: http://repositories:8080
      ISSUES_API_URL: http://issues:8081
      AGENTS_API_URL: http://agents:8082
      IDENTITY_API_URL: http://identity:8083
    init: true
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--output-document=/dev/null', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  repositories-data:
  identity-data:

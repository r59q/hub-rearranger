name: Agent runtime checks

on:
  push:
    paths:
      - '.github/**'
      - 'ops/private-runner/**'
      - 'ops/agent-profiles/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/.prettierrc'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/**'
      - 'ops/private-runner/**'
      - 'ops/agent-profiles/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/.prettierrc'
      - 'Makefile'

permissions:
  contents: read

jobs:
  check:
    # Offline tests never use the credentialed self-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned runtime and profile development tools
        run: |
          python3 -m venv ops/private-runner/.venv
          ops/private-runner/.venv/bin/python -m pip install -r ops/agent-profiles/requirements-dev.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache-dependency-path: ops/agent-intake/go.sum
      - name: Install pinned frontend formatting tools
        working-directory: frontend
        run: npm ci
      - name: Validate diagnostic, profiles, and workflows
        run: make runtime-check profiles-check intake-check

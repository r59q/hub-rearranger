openapi: 3.0.3
info:
  title: Hub Rearranger Agents API
  version: 1.3.0
  description:
    Read-only repository profiles, readiness evidence, and assignment conventions. Readiness
    does not authorize execution.
servers:
  - url: http://localhost:8082
security: []
paths:
  /health:
    head:
      operationId: headHealth
      summary: Check liveness without a response body
      responses:
        '200':
          description: Service process is running.
    get:
      operationId: getHealth
      summary: Check process liveness
      description: Liveness does not verify GitHub access, configuration, or a runner.
      responses:
        '200':
          description: Service process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/assignment-convention:
    head:
      operationId: headAssignmentConvention
      summary: Check convention availability without a response body
      responses:
        '200':
          description: Supported convention is available.
        '500':
          description: The convention request could not be completed; retry the service.
    get:
      operationId: getAssignmentConvention
      summary: Read the supported GitHub assignment convention
      description:
        Static protocol metadata for AW-002/AW-003, independent of repository state. This response
        does not authorize an actor or submit an assignment.
      responses:
        '200':
          description: Supported convention and profile catalog version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentConvention'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/repositories/{owner}/{repo}/profiles:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          maxLength: 39
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
      - name: repo
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_.-]+$
    get:
      operationId: getRepositoryProfiles
      summary: Read profiles at the current default-branch commit
      description:
        Reads GitHub on every request. Missing, malformed, and unsupported catalogs return
        explicit validation states with no partial profiles. revision is a full Git commit SHA, not the
        file blob SHA. This service has no durable catalog storage. Caller access is restricted to the
        private local application network; the configured server-side token determines repository visibility.
      responses:
        '200':
          description: Fresh repository catalog projection and validation results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryProfiles'
        '400':
          description: Invalid owner or repository name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Read credentials lack repository Contents permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repository is unavailable or not visible to the read credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: GitHub rate limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: GitHub failed or returned an invalid response; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Service failed; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: headRepositoryProfiles
      summary: Check profile read availability without a response body
      responses:
        '200':
          description: Fresh repository catalog projection and validation results.
        '400':
          description: Invalid owner or repository name.
        '403':
          description: Read credentials lack repository Contents permission.
        '404':
          description: Repository is unavailable or not visible to the read credentials.
        '429':
          description: GitHub rate limit reached; retry later.
        '502':
          description: GitHub failed or returned an invalid response; retry.
        '500':
          description: Service failed; retry.
        '405':
          description: This endpoint accepts GET and HEAD.
  /v1/repositories/{owner}/{repo}/readiness:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          maxLength: 39
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
      - name: repo
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_.-]+$
    get:
      operationId: getRepositoryReadiness
      summary: Derive repository profile readiness
      description:
        Fresh commit-pinned configuration and latest diagnostic attempt. Evidence must match
        the repository, revision, exact model policy, dedicated runner, and trusted GitHub jobs, and be
        at most 24 hours old. Missing bootstrap files differ from pending or failed verification. Read
        credentials require Metadata, Contents, and Actions read permissions. Service remains private
        to the local application network.
      responses:
        '200':
          description: Configuration and runtime readiness for each validated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryReadiness'
        '400':
          description: Invalid owner or repository name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Read credentials lack Metadata, Contents, or Actions read access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repository is unavailable or not visible to the read credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: GitHub rate limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: GitHub failed or returned an invalid response; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Service failed; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: headRepositoryReadiness
      summary: Check readiness read availability without a response body
      responses:
        '200':
          description: Fresh repository catalog projection and validation results.
        '400':
          description: Invalid owner or repository name.
        '403':
          description: Read credentials lack repository Contents permission.
        '404':
          description: Repository is unavailable or not visible to the read credentials.
        '429':
          description: GitHub rate limit reached; retry later.
        '502':
          description: GitHub failed or returned an invalid response; retry.
        '500':
          description: Service failed; retry.
        '405':
          description: This endpoint accepts GET and HEAD.
  /v1/repositories/{owner}/{repo}/bootstrap:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$
      - name: repo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,100}$
    get:
      operationId: getRepositoryBootstrap
      summary: Review the canonical codex-thorough bootstrap changes
      description:
        Fresh commit-pinned file plan and applicable diff. No GitHub writes, runner provisioning,
        credentials, persisted draft, or authorization grant. The digest binds the target base and every
        proposed file. Private network only.
      responses:
        '200':
          description: Reviewable plan; conflicts and unchanged configurations cannot be published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapPreview'
        '400':
          description: Invalid repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Discovery credentials cannot read the repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repository, initialized default branch, or supported regular files unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Canonical templates or complete GitHub snapshot unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: headRepositoryBootstrap
      summary: Check bootstrap preview availability without returning source
      responses:
        '200':
          description: Preview available.
        '400':
          description: Invalid repository.
        '403':
          description: Discovery credentials cannot read the repository.
        '404':
          description: Repository or supported snapshot unavailable.
        '429':
          description: Rate limited.
        '502':
          description: Complete snapshot or templates unavailable.
        '500':
          description: Bootstrap planning unavailable.
        '405':
          description: This endpoint accepts GET and HEAD.
components:
  responses:
    MethodNotAllowed:
      description: This endpoint accepts only GET and HEAD.
      headers:
        Allow:
          schema:
            type: string
            enum:
              - GET, HEAD
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: The convention request could not be completed; retry the service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    BootstrapPreview:
      type: object
      additionalProperties: false
      required:
        - repository
        - default_branch
        - base_revision
        - digest
        - state
        - private
        - files
        - diagnostics
        - diff
      properties:
        repository:
          type: string
        default_branch:
          type: string
        base_revision:
          type: string
          pattern: ^[0-9a-f]{40}$
        digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        state:
          type: string
          enum:
            - ready
            - unchanged
            - conflict
        private:
          type: boolean
        files:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/BootstrapPreviewFile'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/BootstrapDiagnostic'
        diff:
          type: string
    BootstrapDiagnostic:
      type: object
      additionalProperties: false
      required:
        - code
        - path
        - message
      properties:
        code:
          type: string
        path:
          type: string
        message:
          type: string
    BootstrapPreviewFile:
      type: object
      additionalProperties: false
      required:
        - path
        - status
        - base_sha
        - sha256
        - content
      properties:
        path:
          type: string
        status:
          type: string
          enum:
            - create
            - update
            - unchanged
            - conflict
        base_sha:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{40}$
        sha256:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
        content:
          type: string
          maxLength: 1048576
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    AssignmentConvention:
      type: object
      additionalProperties: false
      required:
        - version
        - profile_catalog_path
        - profile_schema_version
        - assignment
      properties:
        version:
          type: integer
          enum:
            - 1
        profile_catalog_path:
          type: string
          enum:
            - .github/agent-profiles.yml
        profile_schema_version:
          type: integer
          enum:
            - 1
        assignment:
          $ref: '#/components/schemas/AssignmentPolicy'
    AssignmentPolicy:
      type: object
      additionalProperties: false
      required:
        - event
        - source_kind
        - command_template
        - authority
        - required_roles
        - profile_revision
      properties:
        event:
          type: string
          enum:
            - issue_comment.created
        source_kind:
          type: string
          enum:
            - issue
        command_template:
          type: string
          enum:
            - /agent assign {profile_id}@{profile_revision} authority=branch-draft-pr
        authority:
          type: string
          enum:
            - branch-draft-pr
        required_roles:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - maintain
              - admin
        profile_revision:
          $ref: '#/components/schemas/ProfileRevisionPolicy'
    ProfileRevisionPolicy:
      type: object
      additionalProperties: false
      required:
        - format
        - default_branch_ancestor
      properties:
        format:
          type: string
          enum:
            - full-40-character-sha
        default_branch_ancestor:
          type: boolean
          enum:
            - true
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - internal_error
            - method_not_allowed
            - not_found
            - invalid_request
            - access_denied
            - repository_unavailable
            - rate_limited
            - github_unavailable
        message:
          type: string
          minLength: 1
    RepositoryProfiles:
      type: object
      additionalProperties: false
      required:
        - repository
        - catalog_path
        - default_branch
        - revision
        - state
        - profiles
        - diagnostics
      properties:
        repository:
          type: string
        catalog_path:
          type: string
          enum:
            - .github/agent-profiles.yml
        default_branch:
          type: string
          minLength: 1
        revision:
          type: string
          pattern: ^[0-9a-f]{40}$
        state:
          type: string
          enum:
            - valid
            - missing
            - invalid
            - unsupported
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryProfile'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDiagnostic'
    RepositoryProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - configuration
      properties:
        id:
          type: string
        revision:
          type: string
          pattern: ^[0-9a-f]{40}$
        configuration:
          $ref: '#/components/schemas/CatalogProfile'
    ProfileDiagnostic:
      type: object
      additionalProperties: false
      required:
        - code
        - path
        - message
      properties:
        code:
          type: string
          enum:
            - MISSING_FILE
            - INVALID_FILE
            - INVALID_YAML
            - DUPLICATE_KEY
            - UNSUPPORTED_VERSION
            - MISSING_FIELD
            - UNSUPPORTED_FIELD
            - UNSUPPORTED_VALUE
            - INVALID_TYPE
            - INVALID_FORMAT
            - DUPLICATE_VALUE
            - MISSING_CONTEXT
            - LIMIT_EXCEEDED
        path:
          type: string
        message:
          type: string
          minLength: 1
    ReadinessDiagnostic:
      type: object
      additionalProperties: false
      required:
        - code
        - path
        - message
      properties:
        code:
          type: string
          enum:
            - MISSING_FILE
            - WORKFLOW_CONFIGURATION
            - EVIDENCE_MISSING
            - EVIDENCE_ORIGIN
            - EVIDENCE_POLICY
            - EVIDENCE_STALE
            - RUNTIME_FAILED
        path:
          type: string
        message:
          type: string
    ProfileReadiness:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - state
        - runner_label
        - next_action
        - diagnostics
      properties:
        id:
          type: string
        revision:
          type: string
          minLength: 40
          maxLength: 40
        state:
          type: string
          enum:
            - configuration_missing
            - verification_pending
            - runtime_verified
            - verification_failed
        runner_label:
          type: string
        next_action:
          type: string
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessDiagnostic'
        evidence:
          $ref: '#/components/schemas/RuntimeEvidence'
    RepositoryReadiness:
      type: object
      additionalProperties: false
      required:
        - repository
        - default_branch
        - revision
        - catalog_state
        - profiles
        - diagnostics
      properties:
        repository:
          type: string
        default_branch:
          type: string
        revision:
          type: string
          minLength: 40
          maxLength: 40
        catalog_state:
          type: string
          enum:
            - valid
            - missing
            - invalid
            - unsupported
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileReadiness'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDiagnostic'
    CatalogProfile:
      type: object
      additionalProperties: false
      required:
        - enabled
        - name
        - description
        - role
        - adapter
        - model
        - triggers
        - context
        - authority
        - validation
        - continuation
      properties:
        enabled:
          type: boolean
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 500
        role:
          type: string
          enum:
            - implementation
        adapter:
          $ref: '#/components/schemas/CatalogAdapter'
        model:
          $ref: '#/components/schemas/CatalogModel'
        triggers:
          type: object
          additionalProperties: false
          required:
            - assignment
          properties:
            assignment:
              type: string
              enum:
                - issue_comment.created
        context:
          type: object
          additionalProperties: false
          required:
            - sources
            - images
          properties:
            sources:
              type: array
              minItems: 1
              maxItems: 7
              uniqueItems: true
              items:
                type: string
                enum:
                  - issue
                  - issue_comments
                  - repository
                  - instructions
                  - pull_request
                  - review_thread
                  - checks
            images:
              type: boolean
              enum:
                - false
        authority:
          type: object
          additionalProperties: false
          required:
            - mode
            - sandbox
            - network
          properties:
            mode:
              type: string
              enum:
                - branch-draft-pr
            sandbox:
              type: string
              enum:
                - workspace-write
            network:
              type: boolean
              enum:
                - false
        validation:
          type: object
          additionalProperties: false
          required:
            - checks
            - on_failure
          properties:
            checks:
              type: array
              minItems: 1
              maxItems: 1
              uniqueItems: true
              items:
                type: string
                enum:
                  - repository-check
            on_failure:
              type: string
              enum:
                - draft-with-evidence
        continuation:
          type: object
          additionalProperties: false
          required:
            - review_comments
            - pipeline
          properties:
            review_comments:
              type: boolean
            pipeline:
              type: string
              enum:
                - disabled
    CatalogAdapter:
      type: object
      additionalProperties: false
      required:
        - id
        - contract_version
        - runner_label
      properties:
        id:
          type: string
          enum:
            - codex-chatgpt-private-runner
        contract_version:
          type: integer
          enum:
            - 1
        runner_label:
          type: string
          minLength: 1
          maxLength: 64
    CatalogModel:
      type: object
      additionalProperties: false
      required:
        - id
        - reasoning_effort
        - fallback
      properties:
        id:
          type: string
        reasoning_effort:
          type: string
          enum:
            - low
            - medium
            - high
            - xhigh
            - max
        fallback:
          type: string
          enum:
            - none
    RuntimeEvidence:
      type: object
      additionalProperties: false
      required:
        - version
        - repository
        - profile_id
        - profile_revision
        - runner_label
        - requested_model
        - requested_reasoning_effort
        - effective_model
        - effective_reasoning_effort
        - cli_version
        - run_id
        - run_attempt
        - verified_at
        - outcome
        - reason_code
      properties:
        version:
          type: integer
          enum:
            - 1
        repository:
          type: string
        profile_id:
          type: string
        profile_revision:
          type: string
        runner_label:
          type: string
        requested_model:
          type: string
          enum:
            - gpt-6.1-sol
        requested_reasoning_effort:
          type: string
          enum:
            - high
        effective_model:
          type: string
          nullable: true
          enum:
            - gpt-6.1-sol
        effective_reasoning_effort:
          type: string
          nullable: true
          enum:
            - high
        cli_version:
          type: string
          nullable: true
          maxLength: 100
        run_id:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        run_attempt:
          type: integer
          minimum: 1
          maximum: 10000
        verified_at:
          type: string
          format: date-time
          maxLength: 40
        outcome:
          type: string
          enum:
            - verified
            - failed
        reason_code:
          type: string
          enum:
            - verified
            - installation_unavailable
            - authentication_unavailable
            - request_failed
            - effective_policy_unavailable

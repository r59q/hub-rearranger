name: Agent profile diagnostic

# Private runners by default; the operator approved addons for r59q/hub-rearranger.
# Maintainer/default-branch/no-fork guards and exact-policy verification still apply.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-profile-diagnostic
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      (github.event.repository.private == true || github.repository == 'r59q/hub-rearranger') &&
      github.event.repository.fork == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ORIGINAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const { authorizeMaintainers } = await import(
              `file://${process.env.GITHUB_WORKSPACE}/ops/private-runner/authorize.mjs`
            );
            await authorizeMaintainers(github, context.repo.owner, context.repo.repo,
              [process.env.ORIGINAL_ACTOR, process.env.TRIGGERING_ACTOR]);
      - name: Validate fixed probe policy at this commit
        run: |
          python3 -m venv "$RUNNER_TEMP/profile-tools"
          "$RUNNER_TEMP/profile-tools/bin/pip" install -r ops/agent-profiles/requirements-dev.txt
          "$RUNNER_TEMP/profile-tools/bin/python" ops/agent-profiles/validate.py .github/agent-profiles.yml
          "$RUNNER_TEMP/profile-tools/bin/python" - <<'PY'
          import yaml
          with open('.github/agent-profiles.yml') as source:
              profile = yaml.safe_load(source)['profiles']['codex-thorough']
          assert profile['adapter'] == {
              'id': 'codex-chatgpt-private-runner', 'contract_version': 1,
              'runner_label': 'hub-agent-codex'}
          assert profile['model'] == {
              'id': 'gpt-6.1-sol', 'reasoning_effort': 'high', 'fallback': 'none'}
          PY
  diagnostic:
    needs: authorize
    if: >-
      needs.authorize.result == 'success' &&
      (github.event.repository.private == true || github.repository == 'r59q/hub-rearranger') &&
      github.event.repository.fork == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, hub-agent-codex]
    permissions: {}
    timeout-minutes: 5
    outputs:
      record: ${{ steps.probe.outputs.record }}
    steps:
      - name: Verify operator-installed fixed probes
        shell: bash
        run: |
          cd "$HOME/.local/lib/hub-agent-runtime"
          echo '9a8de963014d3b2926f6c7cd2b7f557cbc7c7bc210393c5e9969dcc7673ed52c  diagnose.py' | sha256sum --check --status
          echo '3f734b0af4901c55c6b61b1e7e5f6bdeb6e2a4f5e9156743ff3c7157f12380b6  profile_diagnostic.py' | sha256sum --check --status
      - name: Run fixed no-write probe
        id: probe
        shell: bash
        run: |
          python3 -I "$HOME/.local/lib/hub-agent-runtime/profile_diagnostic.py" > "$RUNNER_TEMP/readiness.json"
          printf 'record=%s\n' "$(cat "$RUNNER_TEMP/readiness.json")" >> "$GITHUB_OUTPUT"
      - name: Remove temporary safe record
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/readiness.json"
  publish:
    needs: [authorize, diagnostic]
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Write allowlisted evidence
        shell: bash
        env:
          EVIDENCE: ${{ needs.diagnostic.outputs.record }}
        run: |
          python3 - <<'PY'
          import json, os
          record = json.loads(os.environ['EVIDENCE'])
          with open('readiness.json', 'w') as output:
              json.dump(record, output)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-readiness-v1-${{ github.run_attempt }}
          path: readiness.json
          if-no-files-found: error
          retention-days: 1

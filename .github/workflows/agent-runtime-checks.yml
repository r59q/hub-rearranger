name: Agent runtime checks

on:
  push:
    paths:
      - '.github/**'
      - 'ops/private-runner/**'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/**'
      - 'ops/private-runner/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  check:
    # Offline tests never use the credentialed self-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned diagnostic development tools
        run: |
          python3 -m venv ops/private-runner/.venv
          ops/private-runner/.venv/bin/python -m pip install -r ops/private-runner/requirements-dev.txt
      - name: Validate diagnostic and workflow
        run: make runtime-check

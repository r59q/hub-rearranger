openapi: 3.0.3
info:
  title: Hub Rearranger Agents API
  version: 1.4.0
  description:
    Read-only repository profiles, readiness evidence, and assignment conventions. Readiness
    does not authorize execution.
servers:
  - url: http://localhost:8082
security: []
paths:
  /health:
    head:
      operationId: headHealth
      summary: Check liveness without a response body
      responses:
        '200':
          description: Service process is running.
    get:
      operationId: getHealth
      summary: Check process liveness
      description: Liveness does not verify GitHub access, configuration, or a runner.
      responses:
        '200':
          description: Service process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/assignment-convention:
    head:
      operationId: headAssignmentConvention
      summary: Check convention availability without a response body
      responses:
        '200':
          description: Supported convention is available.
        '500':
          description: The convention request could not be completed; retry the service.
    get:
      operationId: getAssignmentConvention
      summary: Read the supported GitHub assignment convention
      description:
        Static protocol metadata for AW-002/AW-003, independent of repository state. This response
        does not authorize an actor or submit an assignment.
      responses:
        '200':
          description: Supported convention and profile catalog version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentConvention'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/repositories/{owner}/{repo}/profiles:
    parameters:
      - &id001
        name: owner
        in: path
        required: true
        schema:
          type: string
          maxLength: 39
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
      - &id002
        name: repo
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_.-]+$
    get:
      operationId: getRepositoryProfiles
      summary: Read profiles at the current default-branch commit
      description:
        Reads GitHub on every request. Missing, malformed, and unsupported catalogs return
        explicit validation states with no partial profiles. revision is a full Git commit SHA, not the
        file blob SHA. This service has no durable catalog storage. Caller access is restricted to the
        private local application network; the configured server-side token determines repository visibility.
      responses:
        '200':
          description: Fresh repository catalog projection and validation results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryProfiles'
        '400': &id003
          description: Invalid owner or repository name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id004
          description: Read credentials lack repository Contents permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id005
          description: Repository is unavailable or not visible to the read credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': &id006
          description: GitHub rate limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502': &id007
          description: GitHub failed or returned an invalid response; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': &id008
          description: Service failed; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405': &id009
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: headRepositoryProfiles
      summary: Check profile read availability without a response body
      responses:
        '200':
          description: Fresh repository catalog projection and validation results.
        '400':
          description: Invalid owner or repository name.
        '403':
          description: Read credentials lack repository Contents permission.
        '404':
          description: Repository is unavailable or not visible to the read credentials.
        '429':
          description: GitHub rate limit reached; retry later.
        '502':
          description: GitHub failed or returned an invalid response; retry.
        '500':
          description: Service failed; retry.
        '405':
          description: This endpoint accepts GET and HEAD.
  /v1/repositories/{owner}/{repo}/readiness:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          maxLength: 39
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
      - name: repo
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_.-]+$
    get:
      operationId: getRepositoryReadiness
      summary: Derive repository profile readiness
      description:
        Fresh commit-pinned configuration and latest diagnostic attempt. Evidence must match
        the repository, revision, exact model policy, dedicated runner, and trusted GitHub jobs, and be
        at most 24 hours old. Missing bootstrap files differ from pending or failed verification. Read
        credentials require Metadata, Contents, and Actions read permissions. Service remains private
        to the local application network.
      responses:
        '200':
          description: Configuration and runtime readiness for each validated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryReadiness'
        '400':
          description: Invalid owner or repository name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Read credentials lack Metadata, Contents, or Actions read access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repository is unavailable or not visible to the read credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: GitHub rate limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: GitHub failed or returned an invalid response; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Service failed; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: headRepositoryReadiness
      summary: Check readiness read availability without a response body
      responses:
        '200':
          description: Fresh repository catalog projection and validation results.
        '400':
          description: Invalid owner or repository name.
        '403':
          description: Read credentials lack repository Contents permission.
        '404':
          description: Repository is unavailable or not visible to the read credentials.
        '429':
          description: GitHub rate limit reached; retry later.
        '502':
          description: GitHub failed or returned an invalid response; retry.
        '500':
          description: Service failed; retry.
        '405':
          description: This endpoint accepts GET and HEAD.
  /v1/repositories/{owner}/{repo}/bootstrap:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$
      - name: repo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,100}$
    get:
      operationId: getRepositoryBootstrap
      summary: Review the canonical codex-thorough bootstrap changes
      description:
        Fresh commit-pinned file plan and applicable diff. No GitHub writes, runner provisioning,
        credentials, persisted draft, or authorization grant. The digest binds the target base and every
        proposed file. Private network only.
      responses:
        '200':
          description: Reviewable plan; conflicts and unchanged configurations cannot be published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapPreview'
        '400':
          description: Invalid repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Discovery credentials cannot read the repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Repository, initialized default branch, or supported regular files unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Canonical templates or complete GitHub snapshot unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: headRepositoryBootstrap
      summary: Check bootstrap preview availability without returning source
      responses:
        '200':
          description: Preview available.
        '400':
          description: Invalid repository.
        '403':
          description: Discovery credentials cannot read the repository.
        '404':
          description: Repository or supported snapshot unavailable.
        '429':
          description: Rate limited.
        '502':
          description: Complete snapshot or templates unavailable.
        '500':
          description: Bootstrap planning unavailable.
        '405':
          description: This endpoint accepts GET and HEAD.
  /v1/repositories/{owner}/{repo}/profile-editor:
    parameters:
      - name: owner
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$
      - name: repo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,100}$
    get:
      operationId: getRepositoryProfileEditor
      summary: Read editable codex-thorough choices from the current repository
      description: Private-network authoring context. No persistence, credentials or write authorization.
      responses:
        '200':
          description: Current choices or actionable policy/catalog conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEditor'
        '400':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: previewRepositoryProfile
      summary: Generate a fresh profile configuration and bootstrap review
      description:
        Accepts only structured choices. Canonical schema validation and fixed adapter policy
        apply. Existing unrelated profiles are preserved. No GitHub writes or durable draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileDraft'
      responses:
        '200':
          description:
            Commit-pinned preview; invalid choices produce conflict diagnostics and cannot
            publish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapPreview'
        '400':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/InternalError'
  /v1/repositories/{owner}/{repo}/issues/{number}/assignment:
    parameters:
      - *id001
      - *id002
      - name: number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
    get:
      operationId: getIssueAssignment
      summary: Read issue assignment context and GitHub-derived outcomes
      description:
        Fresh read-only projection. No runner access or durable run state. Links and check
        outcomes are corroborated with GitHub workflow, request, ref and PR objects; never authorization.
        Incomplete evidence remains explicit.
      responses:
        '200':
          description: Issue, current profile and bounded request history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueAssignment'
        '400': *id003
        '403': *id004
        '404': *id005
        '429': *id006
        '502': *id007
        '500': *id008
        '405': *id009
components:
  responses:
    MethodNotAllowed:
      description: This endpoint accepts only GET and HEAD.
      headers:
        Allow:
          schema:
            type: string
            enum:
              - GET, HEAD
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: The convention request could not be completed; retry the service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ProfileEditor:
      type: object
      additionalProperties: false
      required:
        - base_revision
        - draft
        - diagnostics
      properties:
        base_revision:
          type: string
          pattern: ^[0-9a-f]{40}$
        draft:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProfileDraft'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/BootstrapDiagnostic'
    BootstrapPreview:
      type: object
      additionalProperties: false
      required:
        - repository
        - default_branch
        - base_revision
        - digest
        - state
        - private
        - files
        - diagnostics
        - diff
      properties:
        repository:
          type: string
        default_branch:
          type: string
        base_revision:
          type: string
          pattern: ^[0-9a-f]{40}$
        digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        state:
          type: string
          enum:
            - ready
            - unchanged
            - conflict
        private:
          type: boolean
        files:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/BootstrapPreviewFile'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/BootstrapDiagnostic'
        diff:
          type: string
    BootstrapDiagnostic:
      type: object
      additionalProperties: false
      required:
        - code
        - path
        - message
      properties:
        code:
          type: string
        path:
          type: string
        message:
          type: string
    BootstrapPreviewFile:
      type: object
      additionalProperties: false
      required:
        - path
        - status
        - base_sha
        - sha256
        - content
      properties:
        path:
          type: string
        status:
          type: string
          enum:
            - create
            - update
            - unchanged
            - conflict
        base_sha:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{40}$
        sha256:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
        content:
          type: string
          maxLength: 1048576
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    AssignmentConvention:
      type: object
      additionalProperties: false
      required:
        - version
        - profile_catalog_path
        - profile_schema_version
        - assignment
      properties:
        version:
          type: integer
          enum:
            - 1
        profile_catalog_path:
          type: string
          enum:
            - .github/agent-profiles.yml
        profile_schema_version:
          type: integer
          enum:
            - 1
        assignment:
          $ref: '#/components/schemas/AssignmentPolicy'
    AssignmentPolicy:
      type: object
      additionalProperties: false
      required:
        - event
        - source_kind
        - command_template
        - authority
        - required_roles
        - profile_revision
      properties:
        event:
          type: string
          enum:
            - issue_comment.created
        source_kind:
          type: string
          enum:
            - issue
        command_template:
          type: string
          enum:
            - /agent assign {profile_id}@{profile_revision} authority=branch-draft-pr
        authority:
          type: string
          enum:
            - branch-draft-pr
        required_roles:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - maintain
              - admin
        profile_revision:
          $ref: '#/components/schemas/ProfileRevisionPolicy'
    ProfileRevisionPolicy:
      type: object
      additionalProperties: false
      required:
        - format
        - default_branch_ancestor
      properties:
        format:
          type: string
          enum:
            - full-40-character-sha
        default_branch_ancestor:
          type: boolean
          enum:
            - true
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - internal_error
            - method_not_allowed
            - not_found
            - invalid_request
            - access_denied
            - repository_unavailable
            - rate_limited
            - github_unavailable
        message:
          type: string
          minLength: 1
    RepositoryProfiles:
      type: object
      additionalProperties: false
      required:
        - repository
        - catalog_path
        - default_branch
        - revision
        - state
        - profiles
        - diagnostics
      properties:
        repository:
          type: string
        catalog_path:
          type: string
          enum:
            - .github/agent-profiles.yml
        default_branch:
          type: string
          minLength: 1
        revision:
          type: string
          pattern: ^[0-9a-f]{40}$
        state:
          type: string
          enum:
            - valid
            - missing
            - invalid
            - unsupported
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryProfile'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDiagnostic'
    RepositoryProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - configuration
      properties:
        id:
          type: string
        revision:
          type: string
          pattern: ^[0-9a-f]{40}$
        configuration:
          $ref: '#/components/schemas/CatalogProfile'
    ProfileDiagnostic:
      type: object
      additionalProperties: false
      required:
        - code
        - path
        - message
      properties:
        code:
          type: string
          enum:
            - MISSING_FILE
            - INVALID_FILE
            - INVALID_YAML
            - DUPLICATE_KEY
            - UNSUPPORTED_VERSION
            - MISSING_FIELD
            - UNSUPPORTED_FIELD
            - UNSUPPORTED_VALUE
            - INVALID_TYPE
            - INVALID_FORMAT
            - DUPLICATE_VALUE
            - MISSING_CONTEXT
            - LIMIT_EXCEEDED
        path:
          type: string
        message:
          type: string
          minLength: 1
    ReadinessDiagnostic:
      type: object
      additionalProperties: false
      required:
        - code
        - path
        - message
      properties:
        code:
          type: string
          enum:
            - MISSING_FILE
            - WORKFLOW_CONFIGURATION
            - EVIDENCE_MISSING
            - EVIDENCE_ORIGIN
            - EVIDENCE_POLICY
            - EVIDENCE_STALE
            - RUNTIME_FAILED
        path:
          type: string
        message:
          type: string
    ProfileReadiness:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - state
        - runner_label
        - next_action
        - diagnostics
      properties:
        id:
          type: string
        revision:
          type: string
          minLength: 40
          maxLength: 40
        state:
          type: string
          enum:
            - configuration_missing
            - verification_pending
            - runtime_verified
            - verification_failed
        runner_label:
          type: string
        next_action:
          type: string
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessDiagnostic'
        evidence:
          $ref: '#/components/schemas/RuntimeEvidence'
    RepositoryReadiness:
      type: object
      additionalProperties: false
      required:
        - repository
        - default_branch
        - revision
        - catalog_state
        - profiles
        - diagnostics
      properties:
        repository:
          type: string
        default_branch:
          type: string
        revision:
          type: string
          minLength: 40
          maxLength: 40
        catalog_state:
          type: string
          enum:
            - valid
            - missing
            - invalid
            - unsupported
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileReadiness'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDiagnostic'
    AssignmentCheck:
      type: object
      additionalProperties: false
      required:
        - url
        - status
        - conclusion
        - summary
      properties:
        url: &id010
          type: string
          format: uri
        status:
          type: string
        conclusion:
          type: string
        summary:
          type: string
          maxLength: 2000
    AssignmentProposal:
      type: object
      additionalProperties: false
      required:
        - number
        - url
        - state
        - draft
        - branch
        - branch_url
        - head_sha
        - check
      properties:
        number:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        url: *id010
        state:
          type: string
        draft:
          type: boolean
        branch:
          type: string
        branch_url: *id010
        head_sha: &id011
          type: string
          pattern: ^[0-9a-f]{40}$
        check:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AssignmentCheck'
    AssignmentRun:
      type: object
      additionalProperties: false
      required:
        - id
        - attempt
        - url
        - status
        - conclusion
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        attempt:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        url: *id010
        status:
          type: string
        conclusion:
          type: string
    AssignmentRequest:
      type: object
      additionalProperties: false
      required:
        - comment_id
        - url
        - requester_id
        - requester
        - profile_revision
        - created_at
        - edited
        - state
        - run
        - proposal
        - summary
      properties:
        comment_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        url: *id010
        requester_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        requester:
          type: string
        profile_revision: *id011
        created_at:
          type: string
          format: date-time
        edited:
          type: boolean
        state:
          type: string
          enum:
            - requested
            - queued
            - running
            - blocked
            - failed
            - cancelled
            - completed
            - proposal
            - unavailable
        run:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AssignmentRun'
        proposal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AssignmentProposal'
        summary:
          type: string
          maxLength: 2000
    IssueAssignment:
      type: object
      additionalProperties: false
      required:
        - repository
        - repository_id
        - number
        - title
        - body
        - url
        - issue_state
        - profile_revision
        - assignable
        - reason
        - command
        - last_comment_id
        - requests
      properties:
        repository:
          type: string
        repository_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        number:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        title:
          type: string
          maxLength: 512
        body:
          type: string
          maxLength: 4000
        url: *id010
        issue_state:
          type: string
          enum:
            - open
            - closed
        profile_revision: *id011
        assignable:
          type: boolean
        reason:
          type: string
        command:
          type: string
        last_comment_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        requests:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AssignmentRequest'
    CatalogProfile:
      type: object
      additionalProperties: false
      required:
        - enabled
        - name
        - description
        - role
        - adapter
        - model
        - triggers
        - context
        - authority
        - validation
        - continuation
      properties:
        enabled:
          type: boolean
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 500
        role:
          type: string
          enum:
            - implementation
        adapter:
          $ref: '#/components/schemas/CatalogAdapter'
        model:
          $ref: '#/components/schemas/CatalogModel'
        triggers:
          type: object
          additionalProperties: false
          required:
            - assignment
          properties:
            assignment:

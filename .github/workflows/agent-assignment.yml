name: Agent assignment
run-name: Agent assignment ${{ github.event.repository.id }}:${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions: {}

# All attempts, including duplicate deliveries and reruns, hold the same group.
# GitHub may replace a pending duplicate; it never cancels the active assignment.
concurrency:
  group: agent-assignment-${{ github.event.repository.id }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  authorize:
    if: startsWith(github.event.comment.body, '/agent')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    timeout-minutes: 10
    outputs:
      dispatch: ${{ steps.intake.outputs.dispatch }}
      disposition: ${{ steps.intake.outputs.disposition }}
      canonical_run_id: ${{ steps.intake.outputs.canonical_run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned profile validation tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/profile-tools"
          "$RUNNER_TEMP/profile-tools/bin/pip" install -r ops/agent-profiles/requirements-dev.txt
      - name: Build reviewed intake
        working-directory: ops/agent-intake
        shell: bash
        run: go build -o "$RUNNER_TEMP/agent-intake" ./cmd/intake
      - name: Verify current source, roles, policies, and assignment ownership
        id: intake
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/agent-intake" \
            --python "$RUNNER_TEMP/profile-tools/bin/python" \
            --policy "$GITHUB_WORKSPACE/ops/agent-intake/profile_policy.py" \
            --output "$RUNNER_TEMP/invocation.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.intake.outputs.dispatch == 'true'
        with:
          name: agent-invocation-v1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/invocation.json
          if-no-files-found: error
          retention-days: 7

  dispatch:
    name: dispatch
    needs: authorize
    if: needs.authorize.outputs.dispatch == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: read
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.verify.outputs.execute }}
      recovered_artifact_id: ${{ steps.verify.outputs.recovered_artifact_id }}
    steps:
      - name: Report operator gate
        if: (github.event.repository.private != true && github.repository != 'r59q/hub-rearranger') || vars.HUB_AGENT_EXECUTION_ENABLED != 'verified'
        shell: bash
        run: |
          echo 'RUNNER_NOT_READY: execution remains disabled. Verify the approved runner, workload isolation and AW-006 evidence, then enable the reviewed operator gate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: (github.event.repository.private == true || github.repository == 'r59q/hub-rearranger') && vars.HUB_AGENT_EXECUTION_ENABLED == 'verified'
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: (github.event.repository.private == true || github.repository == 'r59q/hub-rearranger') && vars.HUB_AGENT_EXECUTION_ENABLED == 'verified'
        with:
          go-version: '1.25'
          cache: false
      - name: Build reviewed execution verifier
        if: (github.event.repository.private == true || github.repository == 'r59q/hub-rearranger') && vars.HUB_AGENT_EXECUTION_ENABLED == 'verified'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/profile-tools"
          "$RUNNER_TEMP/profile-tools/bin/pip" install -r ops/agent-profiles/requirements-dev.txt
          cd ops/agent-intake
          go build -o "$RUNNER_TEMP/agent-patch" ./cmd/patch
      - name: Reauthorize, verify runtime evidence, and reconcile prior attempts
        id: verify
        if: (github.event.repository.private == true || github.repository == 'r59q/hub-rearranger') && vars.HUB_AGENT_EXECUTION_ENABLED == 'verified'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/agent-patch" \
            --python "$RUNNER_TEMP/profile-tools/bin/python" \
            --policy "$GITHUB_WORKSPACE/ops/agent-intake/profile_policy.py" \
            --evidence "$GITHUB_WORKSPACE/ops/agent-intake/execution_policy.py" \
            --output "$RUNNER_TEMP/execution-input"

  patch:
    name: patch
    needs: [authorize, dispatch]
    if: >-
      needs.authorize.outputs.dispatch == 'true' &&
      needs.dispatch.outputs.execute == 'true' &&
      (github.event.repository.private == true || github.repository == 'r59q/hub-rearranger') &&
      github.event.repository.fork == false &&
      vars.HUB_AGENT_EXECUTION_ENABLED == 'verified' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, hub-agent-codex]
    permissions:
      contents: read
      actions: read
      issues: read
    timeout-minutes: 35
    outputs:
      outcome: ${{ steps.run.outputs.outcome }}
      reason_code: ${{ steps.run.outputs.reason_code }}
    steps:
      - name: Verify operator-installed runtime
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          test -z "$(find "$HOME/.local/lib/hub-agent-execution" -xdev \( -perm /022 \) -print -quit)"
          cd "$HOME/.local/lib/hub-agent-execution"
          echo 'ab71f716de64cc3f03c7884fafae8ed711fa0e4a9f16827b757ac6462176c204  execution.py' | sha256sum --check --status
      - name: Reverify origin and execute isolated patch proposal
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I "$HOME/.local/lib/hub-agent-execution/execution.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.run.outcome != 'skipped'
        with:
          name: agent-patch-v1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-patch-output-${{ github.run_id }}-${{ github.run_attempt }}/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove private proposal transfer files
        if: always()
        shell: bash
        env:
          PATCH_OUTPUT: ${{ runner.temp }}/agent-patch-output-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$PATCH_OUTPUT"

  publish:
    name: publish
    needs: [authorize, dispatch, patch]
    if: >-
      always() && needs.authorize.outputs.dispatch == 'true' &&
      needs.dispatch.result == 'success' &&
      (needs.patch.outputs.outcome == 'ready' ||
       (needs.dispatch.outputs.recovered_artifact_id != '' &&
        needs.dispatch.outputs.recovered_artifact_id != '0')) &&
      (github.event.repository.private == true || github.repository == 'r59q/hub-rearranger') &&
      github.event.repository.fork == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
      checks: write
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
      pr_number: ${{ steps.publish.outputs.pr_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: false
      - name: Build reviewed publication adapters
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/profile-tools"
          "$RUNNER_TEMP/profile-tools/bin/pip" install -r ops/agent-profiles/requirements-dev.txt
          cd ops/agent-intake
          go build -o "$RUNNER_TEMP/agent-publish" ./cmd/publish
      - name: Independently authorize and publish the verified patch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/agent-publish" \
            --python "$RUNNER_TEMP/profile-tools/bin/python" \
            --policy "$GITHUB_WORKSPACE/ops/agent-intake/profile_policy.py" \
            --evidence "$GITHUB_WORKSPACE/ops/agent-intake/publication_policy.py" \
            --patch "$GITHUB_WORKSPACE/ops/agent-intake/publication_patch.py" \
            --output "$RUNNER_TEMP/publication-status.json"
      - name: Preserve safe publication failure evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'publication-status.json'
          if not path.exists():
              record = {
                  'version': 1, 'outcome': 'incomplete',
                  'reason_code': 'PUBLICATION_INCOMPLETE',
                  'run_id': int(os.environ['GITHUB_RUN_ID']),
                  'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT'])}
              path.write_text(json.dumps(record))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Publication incomplete. Review the original run '
                                'and reconcile its branch, PR and evidence before retrying.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-publication-status-v1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-status.json
          if-no-files-found: error
          retention-days: 7

  report:
    name: Execution evidence
    needs: [authorize, dispatch, patch, publish]
    if: always() && needs.authorize.outputs.dispatch == 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Report safe outcome even after runner loss or cancellation
        shell: bash
        env:
          DISPATCH_RESULT: ${{ needs.dispatch.result }}
          PATCH_RESULT: ${{ needs.patch.result }}
          PATCH_OUTCOME: ${{ needs.patch.outputs.outcome }}
          RECOVERED_ARTIFACT: ${{ needs.dispatch.outputs.recovered_artifact_id }}
          PUBLICATION_OUTCOME: ${{ needs.publish.outputs.outcome }}
          PUBLICATION_PR: ${{ needs.publish.outputs.pr_number }}
        run: |
          python3 - <<'PY'
          import json, os
          outcome, reason = 'blocked', 'RUNNER_NOT_READY'
          if os.environ['RECOVERED_ARTIFACT'] not in ('', '0'):
              outcome, reason = 'ready', 'PRIOR_PROPOSAL_RECOVERED'
          elif os.environ['PATCH_RESULT'] == 'cancelled':
              outcome, reason = 'cancelled', 'CANCELLED'
          elif os.environ['PATCH_OUTCOME'] == 'ready':
              outcome, reason = 'ready', 'PROPOSAL_READY'
          elif os.environ['PATCH_RESULT'] == 'failure' or os.environ['DISPATCH_RESULT'] == 'failure':
              outcome, reason = 'failed', 'RUNTIME_FAILED'
          elif os.environ['PATCH_OUTCOME'] in ('blocked', 'failed', 'cancelled'):
              outcome, reason = os.environ['PATCH_OUTCOME'], 'RUNTIME_FAILED'
          record = {
              'version': 1, 'outcome': outcome, 'reason_code': reason,
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT'])}
          with open('execution-status.json', 'w') as output:
              json.dump(record, output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Codex patch proposal\n\n' + reason + '\n\n')
              summary.write('Review the original attempt and its immutable artifacts.\n')
              if os.environ['PUBLICATION_OUTCOME'] == 'published':
                  number = int(os.environ['PUBLICATION_PR'])
                  summary.write('Draft PR: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/pull/' + str(number) + '\n')
              else:
                  summary.write('Publication is incomplete or skipped. Reconcile the separate write job before retrying.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-execution-status-v1-${{ github.run_attempt }}
          path: execution-status.json
          if-no-files-found: error
          retention-days: 7

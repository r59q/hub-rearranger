openapi: 3.1.0
info:
  title: Hub Rearranger Repositories API
  version: 1.0.0
  description: Discovers GitHub repositories and maintains the workspace repository selection.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/repositories:
    get:
      operationId: listSelectedRepositories
      responses:
        '200':
          description: Selected repositories that remain accessible on GitHub.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryList'
        '502':
          $ref: '#/components/responses/GitHubUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/repositories/available:
    get:
      operationId: listAvailableRepositories
      responses:
        '200':
          description: Repositories associated with the configured GitHub account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryList'
        '502':
          $ref: '#/components/responses/GitHubUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/repository-selection:
    put:
      operationId: replaceRepositorySelection
      description: Replaces the complete workspace selection. This does not modify GitHub.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSelectionRequest'
      responses:
        '200':
          description: Updated selected repositories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: One or more repository IDs are not available to the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/GitHubUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GitHubUnavailable:
      description: GitHub could not be reached or rejected the configured credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: The request could not be completed due to an internal failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Repository:
      type: object
      additionalProperties: false
      required: [id, owner, name, full_name, html_url, description, private, default_branch, selected]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        owner:
          type: string
        name:
          type: string
        full_name:
          type: string
        html_url:
          type: string
          format: uri
        description:
          type: string
        private:
          type: boolean
        default_branch:
          type: string
        selected:
          type: boolean
    RepositoryList:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
    ReplaceSelectionRequest:
      type: object
      additionalProperties: false
      required: [repository_ids]
      properties:
        repository_ids:
          type: array
          uniqueItems: true
          maxItems: 1000
          items:
            type: integer
            format: int64
            minimum: 1
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
